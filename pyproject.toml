[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-agent-stress-bench"
version = "0.1.0"
description = "A benchmark suite evaluating frontier LLM agent degradation, failure modes, and constraint adherence across 15-30+ step trajectories."
authors = [{ name = "Jatin Sihag", email = "clyfergamer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
stress-bench = "stress_bench.cli:main"
